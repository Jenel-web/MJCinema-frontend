<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tickets Gallery</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/tickets.css" />
  </head>
  <body>
    <div id="bookings-view" class="bookings-container">

      <div class="booking-sidebar" id = "booking-sidebar">
         <h2 class="user-name" id="display-username">👤 Loading...</h2>

        <ul>
          <li class="tab-btn active" onclick="filterByStatus('ACTIVE')">ACTIVE</li>
          <li class= "tab-btn" onclick="filterByStatus('COMPLETED')">COMPLETED</li>
          <li class="tab-btn" onclick="filterByStatus('CANCELLED')">CANCELLED</li>
        </ul>

        <div class="user-balance">
        <h2>Balance</h2>
        <h3 id="display-balance">₱0.00</h3>
    </div>
    </div>
      <div id="tickets-container">
        <p class="loading-text">Loading your tickets...</p>

      </div>
    <script type="module" src="../js/mjcinema.js"></script>
  </body>
</html>
