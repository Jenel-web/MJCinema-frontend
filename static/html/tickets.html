<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tickets Gallery</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <section id="bookings-view" class="bookings-container">
      <div class="booking-tabs">
        <button class="tab-btn active" onclick="filterByStatus('BOOKED')">
          Active
        </button>
        <button class="tab-btn" onclick="filterByStatus('COMPLETED')">
          History
        </button>
        <button class="tab-btn" onclick="filterByStatus('CANCELLED')">
          Cancelled
        </button>
      </div>

      <div id="tickets-container">
        <p class="loading-text">Loading your tickets...</p>
      </div>
    </section>
    <script type="module" src="../js/mjcinema.js"></script>
  </body>
</html>
